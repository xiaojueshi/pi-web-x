name: Release

# 推 tag（v*）触发：构建八平台二进制 → 冒烟 → SHA256SUMS → 创建 Draft Release。
# Release notes 在 Draft 阶段人工补充（见 docs/release.md），确认后手动发布。
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: 单元测试
        run: bun run test

      - name: 类型检查
        run: bun run typecheck

      - name: 构建八平台二进制
        run: bun run build:all

      - name: 校验八平台产物齐全
        run: |
          cd dist
          expected="pi-web-x-darwin-x64 pi-web-x-darwin-arm64 pi-web-x-linux-x64 pi-web-x-linux-arm64 pi-web-x-linux-x64-musl pi-web-x-linux-arm64-musl pi-web-x-windows-x64.exe pi-web-x-windows-arm64.exe"
          missing=0
          for f in $expected; do
            if [ ! -s "$f" ]; then
              echo "缺失产物: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Linux 产物冒烟（glibc + musl 容器）
        run: |
          ./dist/pi-web-x-linux-x64 --help
          docker run --rm -v "$PWD/dist:/dist" alpine:3 \
            sh -c 'apk add --no-cache libstdc++ && /dist/pi-web-x-linux-x64-musl --help'

      - name: 生成 SHA256SUMS
        run: |
          cd dist
          ASSETS="$(ls pi-web-x-assets-*.tar.gz | head -1)"
          if [ -z "$ASSETS" ]; then
            echo "缺少 assets 发布物（pi-web-x-assets-<version>.tar.gz）" >&2
            exit 1
          fi
          sha256sum \
            $ASSETS \
            pi-web-x-darwin-x64 pi-web-x-darwin-arm64 \
            pi-web-x-linux-x64 pi-web-x-linux-arm64 \
            pi-web-x-linux-x64-musl pi-web-x-linux-arm64-musl \
            pi-web-x-windows-x64.exe pi-web-x-windows-arm64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Draft Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            dist/pi-web-x-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true