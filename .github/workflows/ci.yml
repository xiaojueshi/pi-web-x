name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build:all

      # 每个平台原生执行它自己的产物做冒烟验证。
      - name: 原生产物冒烟（Linux）
        if: runner.os == 'Linux'
        run: ./dist/pi-web-x-linux-x64 --help
      - name: 原生产物冒烟（macOS）
        if: runner.os == 'macOS'
        run: ./dist/pi-web-x-darwin-arm64 --help
      - name: 原生产物冒烟（Windows）
        if: runner.os == 'Windows'
        run: .\dist\pi-web-x-windows-x64.exe --help

      # musl 二进制在 alpine 容器中冒烟（宿主机无 musl loader）。
      - name: musl 产物冒烟（Alpine 容器）
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" alpine:3 \
            sh -c '/dist/pi-web-x-linux-x64-musl --help'
