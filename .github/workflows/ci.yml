name: CI

# 同一分支/PR 的并发运行取消旧排队，避免资源浪费与结果混淆。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build:all

      # 每个平台原生执行它自己的产物做冒烟验证。
      - name: 原生产物冒烟（Linux）
        if: runner.os == 'Linux'
        run: ./dist/pi-web-x-linux-x64 --help
      - name: 原生产物冒烟（macOS）
        if: runner.os == 'macOS'
        run: ./dist/pi-web-x-darwin-arm64 --help
      - name: 原生产物冒烟（Windows）
        if: runner.os == 'Windows'
        run: .\dist\pi-web-x-windows-x64.exe --help

      # Windows runner 自带 pwsh：用 PowerShell 官方 Parser 对 install.ps1
      # 做语法树解析，报错即失败（不依赖第三方 action）。
      - name: install.ps1 语法检查（pwsh）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      # musl 二进制在 alpine 容器中冒烟（宿主机无 musl loader）；
      # bun 编译的二进制动态链接 libstdc++，镜像需先安装对应运行库。
      - name: musl 产物冒烟（Alpine 容器）
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" alpine:3 \
            sh -c 'apk add --no-cache libstdc++ && /dist/pi-web-x-linux-x64-musl --help'

  # 安装脚本静态检查：install.sh 需 POSIX 语法有效并跑通 --help 早期分支
  # （install.ps1 的语法检查在 verify/windows 步骤中随 pwsh 原生执行）。
  install-scripts:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install.sh POSIX 语法检查
        run: |
          sh -n install.sh
          sh install.sh --help
