name: CI

# 同一分支/PR 的并发运行取消旧排队，避免资源浪费与结果混淆。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build:all

      # 每个平台原生执行它自己的产物做冒烟验证。
      - name: 原生产物冒烟（Linux）
        if: runner.os == 'Linux'
        run: ./dist/pi-web-x-linux-x64 --help
      - name: 原生产物冒烟（macOS）
        if: runner.os == 'macOS'
        run: ./dist/pi-web-x-darwin-arm64 --help
      - name: 原生产物冒烟（Windows）
        if: runner.os == 'Windows'
        run: .\dist\pi-web-x-windows-x64.exe --help

      # musl 二进制在 alpine 容器中冒烟（宿主机无 musl loader）；
      # bun 编译的二进制动态链接 libstdc++，镜像需先安装对应运行库。
      - name: musl 产物冒烟（Alpine 容器）
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist" alpine:3 \
            sh -c 'apk add --no-cache libstdc++ && /dist/pi-web-x-linux-x64-musl --help'
